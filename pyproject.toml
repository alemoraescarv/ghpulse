[project]
name = "ghpulse"
version = "0.1.0"
description = "Daily GitHub snapshots into SQLite, trend metrics, and a static weekly tech news page."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
    "selectolax>=0.3",
]

[project.scripts]
ghpulse = "ghpulse.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional: the Anthropic Claude explainer backend. NOT a hard dependency — the
# local Ollama path (httpx) and `ghpulse demo` work without it.
llm = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghpulse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
